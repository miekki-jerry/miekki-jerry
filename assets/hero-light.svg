  <text x="82" y="272" class="body">Mobile, web, macOS, and production AI systems.</text>

  <line x1="760" y1="54" x2="760" y2="306" stroke="#d0d7de" stroke-width="1"/>
  <text x="806" y="77" class="process-label">PRODUCT LOOP</text>

  <line x1="820" y1="110" x2="820" y2="271" stroke="#b6c2cf" stroke-width="2"/>
  <circle cx="820" cy="118" r="7" fill="#0969da"/>
  <circle cx="820" cy="168" r="7" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <circle cx="820" cy="218" r="7" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <circle cx="820" cy="268" r="7" fill="#ffffff" stroke="#0969da" stroke-width="2"/>

