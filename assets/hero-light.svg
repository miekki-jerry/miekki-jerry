<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Bogumił Łuć, AI Product Engineer and AI Builder</title>
  <desc id="desc">From ambiguous ideas to working AI products across mobile, web, macOS, recommendations, and AI agents.</desc>
  <style>
