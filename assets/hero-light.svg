    .kicker {
      fill: #0969da;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2.8px;
    }
    .name {
      fill: #1f2328;
      font-size: 52px;
      font-weight: 750;
      letter-spacing: -1.8px;
    }
    .role {
      fill: #1f2328;
      font-size: 25px;
