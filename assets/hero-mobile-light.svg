      font-size: 16px;
      font-weight: 650;
      letter-spacing: 0.8px;
    }
  </style>

  <rect x="1" y="1" width="718" height="618" rx="24" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
  <rect x="44" y="42" width="632" height="4" rx="2" fill="#0969da"/>

  <text x="48" y="86" class="kicker">PRODUCT THINKING × AI EXECUTION</text>
  <text x="48" y="156" class="name">BOGUMIŁ ŁUĆ</text>
  <text x="48" y="205" class="role">AI Product Engineer &amp; AI Builder</text>
  <text x="48" y="261" class="body">From ambiguous ideas to working AI products.</text>
  <text x="48" y="299" class="body">Mobile, web, macOS, and production AI systems.</text>

  <line x1="48" y1="340" x2="672" y2="340" stroke="#d0d7de" stroke-width="1"/>
  <text x="48" y="382" class="process-label">PRODUCT LOOP</text>

  <line x1="92" y1="431" x2="628" y2="431" stroke="#b6c2cf" stroke-width="2"/>
  <circle cx="92" cy="431" r="8" fill="#0969da"/>
  <circle cx="270" cy="431" r="8" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <circle cx="450" cy="431" r="8" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <circle cx="628" cy="431" r="8" fill="#ffffff" stroke="#0969da" stroke-width="2"/>

  <text x="92" y="473" text-anchor="middle" class="step-number">01</text>
  <text x="92" y="502" text-anchor="middle" class="step-name">FRAME</text>
  <text x="270" y="473" text-anchor="middle" class="step-number">02</text>
  <text x="270" y="502" text-anchor="middle" class="step-name">BUILD</text>
  <text x="450" y="473" text-anchor="middle" class="step-number">03</text>
  <text x="450" y="502" text-anchor="middle" class="step-name">VERIFY</text>
  <text x="628" y="473" text-anchor="middle" class="step-number">04</text>
