<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img" aria-labelledby="title desc">
  <title id="title">Bogumił Łuć, AI Product Engineer and AI Builder</title>
  <desc id="desc">From ambiguous ideas to working AI products across mobile, web, macOS, recommendations, and AI agents.</desc>
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .kicker {
      fill: #0969da;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2.4px;
    }
    .name {
      fill: #1f2328;
      font-size: 52px;
      font-weight: 750;
      letter-spacing: -1.8px;
    }
    .role {
      fill: #1f2328;
      font-size: 27px;
      font-weight: 650;
    }
    .body {
      fill: #59636e;
      font-size: 23px;
      font-weight: 450;
    }
    .process-label {
      fill: #59636e;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 2.2px;
    }
    .step-number {
